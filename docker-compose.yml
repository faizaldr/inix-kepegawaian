services:
  db:
    image: mysql:8.0
    container_name: inix_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inix_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: inix_monolith_container
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: inix_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      APP_ENV: development
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html

volumes:
  mysql_data:
